```yaml
name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # -------------------------
      # CHECKOUT PROJECT
      # -------------------------
      - name: Checkout
        uses: actions/checkout@v4

      # -------------------------
      # SETUP PYTHON
      # -------------------------
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # -------------------------
      # SETUP JAVA
      # -------------------------
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      # -------------------------
      # INSTALL FLET
      # -------------------------
      - name: Install Flet
        run: |
          python -m pip install --upgrade pip
          pip install flet

      # -------------------------
      # CHECK INSTALLATION
      # -------------------------
      - name: Check Flet
        run: |
          python --version
          flet --version

      # -------------------------
      # CHECK PROJECT FILES
      # -------------------------
      - name: Check project files
        run: |
          echo "Files in project:"
          find . -maxdepth 2 -type f | sort

      # -------------------------
      # BUILD APK
      # -------------------------
      - name: Build APK
        run: |
          flet build apk \
            --yes \
            --verbose \
            --include "*.json" \
            --include "*.png" \
            --include "*.jpg" \
            --include "*.jpeg"

      # -------------------------
      # SHOW BUILD OUTPUT
      # -------------------------
      - name: Check APK
        run: |
          echo "APK files:"
          find build -type f -name "*.apk" -print

      # -------------------------
      # UPLOAD APK
      # -------------------------
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: bible-app-apk
          path: build/apk/*.apk
          if-no-files-found: error
```

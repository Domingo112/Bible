name: Build Bible App APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # 1. Download your project
      - name: Checkout
        uses: actions/checkout@v6

      # 2. Install Python
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      # 3. Install Java
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "17"

      # 4. Install Flutter
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # 5. Check Flutter
      - name: Check Flutter
        run: |
          flutter --version
          dart --version

      # 6. Install Flet
      - name: Install Flet
        run: |
          python -m pip install --upgrade pip
          pip install "flet[all]"

      # 7. Check Flet
      - name: Check Flet
        run: |
          flet --version

      # 8. Build APK
      - name: Build APK
        run: |
          flet build apk

      # 9. Upload APK
      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: bible-app-apk
          path: build/apk/*.apk
          if-no-files-found: error

```toml
[project]
name = "bible-app"
version = "1.0.0"
description = "A modern Bible and devotional app"
requires-python = ">=3.10"
dependencies = [
    "flet"
]

[tool.flet]
product = "Bible App"
org = "com.bibleapp"
company = "Domingo Bible App"
copyright = "Copyright © 2026 Bible App"

[tool.flet.android]
min_sdk_version = 23
target_sdk_version = 35

[tool.flet.android.permissions]
internet = true
network_state = true
vibrate = true

[tool.bible_app]
theme = "light"
default_bible_version = "KJV"

[bible]
enabled = true
search = true
random_verse = true
daily_verse = true
book_selection = true
chapter_selection = true
verse_selection = true
bookmarks = true
highlights = true
copy = true
share = true
reading_history = true
continue_reading = true

[reader]
font_size = 18
line_spacing = 1.5
show_verse_numbers = true
show_chapter_title = true
show_book_name = true
swipe_navigation = true
tap_to_scroll = true

[search]
enabled = true
search_books = true
search_chapters = true
search_verses = true
search_devotionals = true
clear_button = true
search_history = true

[devotional]
enabled = true
daily_devotional = true
show_theme = true
show_day = true
show_scripture = true
show_scripture_text = true
show_reading_time = true
see_more = true
share = true
bookmark = true

[home]
